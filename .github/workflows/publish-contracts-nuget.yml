name: Publish IntegratorAI.Api.Contracts

on:
  push:
    tags:
      - 'contracts-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#contracts-v}" >> $GITHUB_OUTPUT

      - name: Pack
        run: dotnet pack Source/Integrator/IntegratorAI.Api.Contracts/IntegratorAI.Api.Contracts.csproj --configuration Release /p:Version=${{ steps.version.outputs.VERSION }} --output ./nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --source "https://nuget.pkg.github.com/WiktorWijata/index.json" --api-key ${{ secrets.GITHUB_TOKEN }}
