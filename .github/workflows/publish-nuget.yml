name: Publish NuGet Package

on:
  push:
    tags:
      - '*-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Extract package name and version from tag
        id: meta
        run: |
          TAG=${GITHUB_REF_NAME}
          PACKAGE=${TAG%-v*}
          VERSION=${TAG#*-v}
          echo "PACKAGE=$PACKAGE" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Find .csproj by PackageId
        id: project
        run: |
          PACKAGE="${{ steps.meta.outputs.PACKAGE }}"
          CSPROJ=$(grep -rl "<PackageId>$PACKAGE</PackageId>" --include="*.csproj" . | head -1)
          if [ -z "$CSPROJ" ]; then
            echo "Nie znaleziono projektu z PackageId: $PACKAGE"
            exit 1
          fi
          echo "PROJECT_PATH=$CSPROJ" >> $GITHUB_OUTPUT

      - name: Pack
        run: dotnet pack ${{ steps.project.outputs.PROJECT_PATH }} --configuration Release /p:Version=${{ steps.meta.outputs.VERSION }} --output ./nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --source "https://nuget.pkg.github.com/WiktorWijata/index.json" --api-key ${{ secrets.GITHUB_TOKEN }}
