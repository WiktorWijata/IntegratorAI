name: Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, prod]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/wiktorwijata/integratorai-api
  MIGRATOR_IMAGE: ghcr.io/wiktorwijata/integratorai-db-migrator

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DbMigrator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Deployment/Docker/Dockerfiles/IntegratorAI.DbMigrator.Dockerfile
          push: true
          tags: |
            ${{ env.MIGRATOR_IMAGE }}:${{ github.event.inputs.environment }}-latest
            ${{ env.MIGRATOR_IMAGE }}:${{ github.event.inputs.environment }}-${{ github.sha }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Deployment/Docker/Dockerfiles/IntegratorAI.Api.Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.event.inputs.environment }}-latest
            ${{ env.API_IMAGE }}:${{ github.event.inputs.environment }}-${{ github.sha }}

  deploy:
    needs: push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Deployment/Docker/docker-compose.yml"
          target: /opt/environments/${{ github.event.inputs.environment }}/apps/integratorai
          strip_components: 2

      - name: Copy DbMigrator appsettings template to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Database/IntegratorAI.DbMigrator/appsettings.Production.json"
          target: /opt/environments/${{ github.event.inputs.environment }}/apps/integratorai/templates/migrator
          strip_components: 2

      - name: Copy API appsettings template to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Source/Integrator/IntegratorAI.Api/appsettings.Production.json"
          target: /opt/environments/${{ github.event.inputs.environment }}/apps/integratorai/templates/api
          strip_components: 3

      - name: Copy resolve-config script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Deployment/Scripts/resolve-config.sh"
          target: /opt/environments/${{ github.event.inputs.environment }}/apps/integratorai
          strip_components: 2

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_HOST,DB_PORT,DB_PASSWORD,REDIS_HOST,REDIS_PORT,REDIS_PASSWORD,HF_API_KEY,GHCR_TOKEN,OTEL_SERVICE_NAME,OTEL_EXPORTER_OTLP_ENDPOINT
          script: |
            set -e
            cd /opt/environments/${{ github.event.inputs.environment }}/apps/integratorai

            cat > .env <<EOF
            ENV_NAME=${{ github.event.inputs.environment }}
            API_TAG=${{ github.event.inputs.environment }}-latest
            MIGRATOR_TAG=${{ github.event.inputs.environment }}-latest
            PROXY_NETWORK=${{ vars.PROXY_NETWORK }}
            EOF

            echo "HF_API_KEY=${HF_API_KEY}" >> .env
            echo "OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME}" >> .env
            echo "OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}" >> .env

            bash resolve-config.sh

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u wiktorwijata --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
